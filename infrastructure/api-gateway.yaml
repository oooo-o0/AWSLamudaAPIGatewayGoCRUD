      HttpMethod: GET
      ResourceId: !Ref NotificationsResource
      RestApiId: !Ref KaigoApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${NotificationHandlerFunction.Arn}/invocations
      MethodResponses:
        - StatusCode: 200

  # Notifications - POST
  NotificationsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      HttpMethod: POST
      ResourceId: !Ref NotificationsResource
      RestApiId: !Ref KaigoApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${NotificationHandlerFunction.Arn}/invocations
