            method.response.header.Access-Control-Allow-Origin: true

  # Auth Login - POST (認証は不要)
  AuthLoginPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: POST
      ResourceId: !Ref AuthLoginResource
      RestApiId: !Ref KaigoApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthLoginFunction.Arn}/invocations
      MethodResponses:
        - StatusCode: 200

  # Auth Signup - POST (認証は不要)
  AuthSignupPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: POST
      ResourceId: !Ref AuthSignupResource
      RestApiId: !Ref KaigoApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthSignupFunction.Arn}/invocations
      MethodResponses:
        - StatusCode: 200

  # Auth VerifyToken - POST (認証は不要)
  AuthVerifyTokenPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: NONE
      HttpMethod: POST
      ResourceId: !Ref AuthVerifyTokenResource
      RestApiId: !Ref KaigoApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthVerifyTokenFunction.Arn}/invocations
      MethodResponses:
        - StatusCode: 200

  ##############################
  # Deploy Stage
  ##############################
  KaigoDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - UsersGetMethod
      - UsersPostMethod
      - UsersOptionsMethod
      - CarePlansGetMethod
      - CarePlansPostMethod
      - CarePlansOptionsMethod
      - ClaimsGetMethod
      - ClaimsPostMethod
      - ClaimsOptionsMethod
      - FacilitiesGetMethod
      - FacilitiesPostMethod
      - FacilitiesOptionsMethod
      - NotificationsGetMethod
      - NotificationsPostMethod
      - NotificationsOptionsMethod
      - AuthLoginPostMethod
      - AuthSignupPostMethod
      - AuthVerifyTokenPostMethod
    Properties:
      RestApiId: !Ref KaigoApi
      StageName: prod
      Description: Production deployment

  ##############################
  # Stage Settings (Access Log)
  ##############################
  KaigoProdStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      StageName: prod
      Description: Production Stage
      RestApiId: !Ref KaigoApi
      DeploymentId: !Ref KaigoDeployment
      MethodSettings:
        - DataTraceEnabled: true
          HttpMethod: "*"
          LoggingLevel: INFO
          ResourcePath: "/*"
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","caller":"$context.identity.caller","user":"$context.identity.user","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","protocol":"$context.protocol","responseLength":"$context.responseLength"}'

  ##############################
  # CloudWatch Logs Group for API Gateway
  ##############################
  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/api-gateway/kaigo-prod
      RetentionInDays: 14

Outputs:
  ApiGatewayRestApiId:
    Description: REST API ID
    Value: !Ref KaigoApi
  ApiGatewayInvokeUrl:
    Description: API Gateway invoke URL (prod stage)
    Value: !Sub "https://${KaigoApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
