AWSTemplateFormatVersion: '2010-09-09'
Description: API Gateway REST API for Kaigo Insurance System

Parameters:
  LambdaS3Bucket:
    Type: String
    Description: S3 Bucket for Lambda code
  LambdaS3Prefix:
    Type: String
    Description: S3 Prefix for Lambda code
  CognitoUserPoolId:
    Type: String
    Description: Cognito User Pool ID for Authorizer

Resources:

  ##############################
  # REST API
  ##############################
  KaigoApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: KaigoInsuranceApi
      Description: REST API for Kaigo Insurance System

  ##############################
  # Cognito Authorizer
  ##############################
  CognitoAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Properties:
      Name: CognitoAuthorizer
      Type: COGNITO_USER_POOLS
      IdentitySource: method.request.header.Authorization
      RestApiId: !Ref KaigoApi
      ProviderARNs:
        - !Sub arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${CognitoUserPoolId}

  ##############################
  # Resources
  ##############################

  UsersResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt KaigoApi.RootResourceId
      PathPart: users
      RestApiId: !Ref KaigoApi

  CarePlansResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt KaigoApi.RootResourceId
      PathPart: careplans
      RestApiId: !Ref KaigoApi

  ClaimsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt KaigoApi.RootResourceId
      PathPart: claims
      RestApiId: !Ref KaigoApi

  FacilitiesResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt KaigoApi.RootResourceId
      PathPart: facilities
      RestApiId: !Ref KaigoApi

  NotificationsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt KaigoApi.RootResourceId
      PathPart: notifications
      RestApiId: !Ref KaigoApi

  AuthResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !GetAtt KaigoApi.RootResourceId
      PathPart: auth
      RestApiId: !Ref KaigoApi

  AuthLoginResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: login
      RestApiId: !Ref KaigoApi

  AuthSignupResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: signup
      RestApiId: !Ref KaigoApi

  AuthVerifyTokenResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      ParentId: !Ref AuthResource
      PathPart: verify-token
      RestApiId: !Ref KaigoApi

  ##############################
  # Methods & Lambda Integration
  ##############################

  # Users - GET
  UsersGetMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      HttpMethod: GET
      ResourceId: !Ref UsersResource
      RestApiId: !Ref KaigoApi
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserHandlerFunction.Arn}/invocations
      MethodResponses:
        - StatusCode: 200
  UserProfileResource:
  Type: AWS::ApiGateway::Resource
  Properties:
    ParentId: !Ref UsersResource
    PathPart: profile
    RestApiId: !Ref KaigoApi

UserProfileGetMethod:
  Type: AWS::ApiGateway::Method
  Properties:
    AuthorizationType: COGNITO_USER_POOLS
    AuthorizerId: !Ref CognitoAuthorizer
    HttpMethod: GET
    ResourceId: !Ref UserProfileResource
    RestApiId: !Ref KaigoApi
    Integration:
      Type: AWS_PROXY
      IntegrationHttpMethod: POST
      Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserProfileFunction.Arn}/invocations
    MethodResponses:
      - StatusCode: 200

UserProfileOptionsMethod:
  Type: AWS::ApiGateway::Method
  Properties:
    AuthorizationType: NONE
    HttpMethod: OPTIONS
    ResourceId: !Ref UserProfileResource
    RestApiId: !Ref KaigoApi
    Integration:
      Type: MOCK
      RequestTemplates:
        application/json: '{"statusCode":200}'
      IntegrationResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
            method.response.header.Access-Control-Allow-Methods: "'GET,OPTIONS'"
            method.response.header.Access-Control-Allow-Origin: "'*'"
    MethodResponses:
      - StatusCode: 200
        ResponseParameters:
          method.response.header.Access-Control-Allow-Headers: true
          method.response.header.Access-Control-Allow-Methods: true
          method.response.header.Access-Control-Allow-Origin: true

UserRoleResource:
  Type: AWS::ApiGateway::Resource
  Properties:
    ParentId: !Ref UsersResource
    PathPart: role
    RestApiId: !Ref KaigoApi

UserRolePostMethod:
  Type: AWS::ApiGateway::Method
  Properties:
    AuthorizationType: COGNITO_USER_POOLS
    AuthorizerId: !Ref CognitoAuthorizer
    HttpMethod: POST
    ResourceId: !Ref UserRoleResource
    RestApiId: !Ref KaigoApi
    Integration:
      Type: AWS_PROXY
      IntegrationHttpMethod: POST
      Uri: !Sub arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${UserRoleFunction.Arn}/invocations
    MethodResponses:
      - StatusCode: 200

UserRoleOptionsMethod:
  Type: AWS::ApiGateway::Method
  Properties:
    AuthorizationType: NONE
    HttpMethod: OPTIONS
    ResourceId: !Ref UserRoleResource
    RestApiId: !Ref KaigoApi
    Integration:
      Type: MOCK
      RequestTemplates:
        application/json: '{"statusCode":200}'
      IntegrationResponses:
        - StatusCode: 200
          ResponseParameters:
            method.response.header.Access-Control-Allow-Headers: "'Content-Type,Authorization'"
            method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
            method.response.header.Access-Control-Allow-Origin: "'*'"
    MethodResponses:
      - StatusCode: 200
        ResponseParameters:
          method.response.header.Access-Control-Allow-Headers: true
          method.response.header.Access-Control-Allow-Methods: true
          method.response.header.Access-Control-Allow-Origin: true


  # Users - POST
  UsersPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      AuthorizationType: COGNITO_USER_POOLS
      AuthorizerId: !Ref CognitoAuthorizer
      HttpMethod: POST
      ResourceId: !Ref UsersResource
      RestApiId: !Ref KaigoApi
      Integration:
        Type: AWS_PROXY
